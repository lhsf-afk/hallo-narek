<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Registrieren</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: sans-serif;
      background: #e8f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .card {
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 380px;
    }
    h1 { text-align: center; margin-bottom: 24px; color: #333; }
    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #2196F3;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      margin-bottom: 8px;
    }
    button:hover { background: #1976D2; }
    .link { text-align: center; margin-top: 12px; }
    .link a { color: #2196F3; text-decoration: none; }
    .error { color: red; font-size: 0.875rem; margin-bottom: 8px; text-align: center; }
    .success { color: green; font-size: 0.875rem; margin-bottom: 8px; text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <h1>☁️ Registrieren</h1>
    <div class="error" id="error"></div>
    <div class="success" id="success"></div>
    <input type="email" id="email" placeholder="E-Mail" />
    <input type="password" id="password" placeholder="Passwort (min. 6 Zeichen)" />
    <button onclick="signup()">Konto erstellen</button>
    <div class="link"><a href="index.html">Bereits ein Konto? Einloggen</a></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const client = window.supabase.createClient(
      'https://ogennuabttnskcbfkmol.supabase.co',
      'sb_publishable_kLlJmJGp7U5rZQMJ7I1_mg_ZUFxODmV'
    );

    async function signup() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const { error } = await client.auth.signUp({ email, password });
      if (error) {
        document.getElementById('error').textContent = error.message;
      } else {
        document.getElementById('success').textContent = 'Konto erstellt! Bitte E-Mail bestätigen, dann einloggen.';
      }
    }
  </script>
</body>
</html>
